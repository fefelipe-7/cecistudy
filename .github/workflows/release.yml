name: release mobile (apk + ipa + ota)

# Pipeline de CD do cecistudy ♡
#
# Dispara em **release publicado** (o release-please cria a tag e o Release) e em
# dispatch manual com a tag, para recuperação. Push na main NÃO publica.
#
# Em cada execução, ele:
#   1. valida o código e builda o bundle web;
#   2. builda o APK Android (release assinado quando há keystore, senão debug);
#   3. builda o IPA iOS (release assinado quando há certificado; senão unsigned de
#      dispositivo — pronto para sideload com o seu apple id, ex. Sideloadly/AltStore);
#   4. anexa os artefatos ao GitHub Release da tag
#      (cecistudy-<versão>-android.apk / -ios.ipa / .zip do bundle web);
#   5. publica o OTA no GitHub Pages com a MESMA versão do release.
#
# Versão: a da tag (`v1.2.3` → `1.2.3`). Quem cria a tag é o release-please, que
# também mantém o CHANGELOG.md. O canal OTA é único, na raiz do Pages.
#
# Secrets de assinatura (opcionais — sem eles o build cai para debug/simulador):
#   ANDROID_KEYSTORE                base64 do .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD       senha do keystore
#   ANDROID_KEY_ALIAS               alias da chave
#   ANDROID_KEY_PASSWORD            senha da chave
#   IOS_TEAM_ID                     team id da Apple (ex.: AB12CD34EF)
#   IOS_CERTIFICATE                 base64 do .p12 (Apple Distribution/Dev)
#   IOS_CERTIFICATE_PASSWORD        senha do .p12
#   IOS_PROVISIONING_PROFILE        base64 do .mobileprovision
#   IOS_EXPORT_METHOD (opcional)    ad-hoc (padrão) | app-store | development

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag do release (ex.: v1.2.3) — obrigatória no dispatch'
        required: true
        type: string

concurrency:
  group: release-pipeline
  # nunca cancela um release em andamento (o release anterior era interrompido no meio)
  cancel-in-progress: false

permissions:
  contents: read

env:
  OTA_DIR: ota-site
  OTA_BASE_URL: https://fefelipe-7.github.io/cecistudy
  KEEP_VERSIONS: '5'

jobs:
  prepare:
    name: validar + bundle web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.checksum.outputs.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install deps
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test

      - name: boundary check (mobile/desktop/packages)
        run: node .github/scripts/check-boundaries.mjs

      - name: build web
        run: npm run build

      - name: derive version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "release" ]; then TAG="$RELEASE_TAG"; else TAG="$INPUT_TAG"; fi
          if [ -z "$TAG" ]; then echo "::error::tag ausente"; exit 1; fi
          # O OTA deriva a versão do tag: `cecistudy-v1.1.0` viraria
          # `cecistudy-cecistudy-v1.1.0` e o app nunca veria a atualização.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag fora do padrão vX.Y.Z: $TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: zip bundle (ota)
        run: |
          mkdir -p "$OTA_DIR/bundles"
          (cd dist && zip -r "../$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" .)

      - name: compute checksum
        id: checksum
        run: |
          echo "sha=$(sha256sum "$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: upload dist (para sync nativo)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

      - name: upload ota bundle
        uses: actions/upload-artifact@v7
        with:
          name: ota-bundle
          path: ${{ env.OTA_DIR }}/bundles/cecistudy-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  android:
    name: android apk
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: setup java (temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: setup android sdk
        # setup-android@v3 quebra na imagem atual (6/7 licenças recusadas — Android XR).
        # Usa o SDK pré-instalado e aceita as licenças sem interação; o gradle
        # baixa automaticamente plataforma/build-tools 36 quando faltarem.
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || true
          echo "→ sdk pronto (compileSdk 36)" >> "$GITHUB_STEP_SUMMARY"

      - name: install deps
        run: npm ci

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: set version env
        run: |
          echo "APP_VERSION_NAME=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: import keystore (quando presente)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.jks" >> "$GITHUB_ENV"
          echo "→ release assinado: true" >> "$GITHUB_STEP_SUMMARY"

      - name: sync capacitor (android)
        run: npx cap sync android

      - name: build apk
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: upload apk
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: ios ipa
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install deps
        run: npm ci

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: sync capacitor (ios)
        run: npx cap sync ios

      # o projeto estava congelado em MARKETING_VERSION = 1.0: o IPA nunca recebia
      # a versão do release (SPEC-026 D8).
      - name: set version env
        run: |
          echo "APP_VERSION_NAME=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: setup code signing
        if: env.IOS_TEAM_ID != ''
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN=cecistudy-build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "$IOS_CERTIFICATE" | base64 --decode > /tmp/cecistudy.p12
          security import /tmp/cecistudy.p12 -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision"
          PROFILE_NAME=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision" 2>/dev/null | plutil -extract Name raw -)
          echo "IOS_PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "→ ipa assinado: true" >> "$GITHUB_STEP_SUMMARY"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: build ipa (release, dispositivo)
        if: env.IOS_TEAM_ID != ''
        env:
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          cd ios/App
          export_options=/tmp/export-options.plist
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${IOS_EXPORT_METHOD:-ad-hoc}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.IOS_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/cecistudy.xcarchive \
            DEVELOPMENT_TEAM="${{ env.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_SPECIFIER" \
            MARKETING_VERSION="$APP_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/cecistudy.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$export_options"

      - name: 'build ipa unsigned (dispositivo → sideload)'
        if: env.IOS_TEAM_ID == ''
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -1)
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          (cd build/unsigned && zip -r ../cecistudy-unsigned.ipa Payload)
          ls -la build/cecistudy-unsigned.ipa
          echo "→ ipa unsigned p/ sideload: true" >> "$GITHUB_STEP_SUMMARY"

      - name: upload ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ios/App/build/**/*.ipa
          if-no-files-found: error

  publish:
    name: github release + ota
    needs: [prepare, android, ios]
    if: always() && needs.prepare.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install deps
        run: npm ci

      - name: download apk
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: download ipa
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: release-assets

      - name: download ota bundle
        uses: actions/download-artifact@v8
        with:
          name: ota-bundle
          path: ota-bundle

      - name: organize release assets
        run: |
          mkdir -p final
          cp "$(find release-assets -name '*.apk' | head -1)" "final/cecistudy-$VERSION-android.apk"
          cp "$(find release-assets -name '*.ipa' | head -1)" "final/cecistudy-$VERSION-ios.ipa"
          cp "$(find ota-bundle -name '*.zip' | head -1)" "final/cecistudy-$VERSION.zip"
          ls -la final

      - name: attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # normalmente o release já existe: quem cria é o release-please, com as
          # notas do CHANGELOG. aqui só anexamos os artefatos.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "cecistudy v$VERSION" --notes "artefatos gerados pelo pipeline de release (android, ios e bundle web/ota)."
          fi
          # --clobber permite reexecutar o workflow numa tag já publicada.
          # falha aqui derruba o job de propósito: release sem apk/ipa não é release.
          gh release upload "$TAG" \
            "final/cecistudy-$VERSION-android.apk" \
            "final/cecistudy-$VERSION-ios.ipa" \
            "final/cecistudy-$VERSION.zip" --clobber

      - name: publish ota (version.json + bundles)
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p "$OTA_DIR/bundles"
          cp "final/cecistudy-$VERSION.zip" "$OTA_DIR/bundles/cecistudy-$VERSION.zip"
          node .github/scripts/ota-manifest.mjs

      - name: setup pages
        uses: actions/configure-pages@v6

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.OTA_DIR }}

      - name: deploy to pages
        uses: actions/deploy-pages@v5

name: release (apk + ipa + ota)

# Pipeline único de CD do cecistudy ♡
#
# Em um tag v* (ex.: `v1.2.3`) ou via dispatch manual, ele:
#   1. valida o código (lint + testes) e builda o bundle web;
#   2. builda o APK Android (release assinado quando há keystore, senão debug);
#   3. builda o IPA iOS (release assinado quando há certificado, senão só simulador);
#   4. cria um GitHub Release `v<versão>` com os artefatos de cada dispositivo
#      (cecistudy-<versão>-android.apk / -ios.ipa / .zip do bundle web);
#   5. publica o OTA no GitHub Pages com a MESMA versão do release — ou seja,
#      todo release vira também uma atualização over-the-air do app.
#
# Versão:
#   - tag push  v1.2.3  → versão "1.2.3"
#   - dispatch manual   → versão digitada, ou "1.0.<nº de commits>" se vazia
#
# Secrets de assinatura (opcionais — sem eles o build cai para debug/simulador):
#   ANDROID_KEYSTORE                base64 do .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD       senha do keystore
#   ANDROID_KEY_ALIAS               alias da chave
#   ANDROID_KEY_PASSWORD            senha da chave
#   IOS_TEAM_ID                     team id da Apple (ex.: AB12CD34EF)
#   IOS_CERTIFICATE                 base64 do .p12 (Apple Distribution/Dev)
#   IOS_CERTIFICATE_PASSWORD        senha do .p12
#   IOS_PROVISIONING_PROFILE        base64 do .mobileprovision
#   IOS_EXPORT_METHOD (opcional)    ad-hoc (padrão) | app-store | development

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'versão do release (ex.: 1.2.3). vazio = 1.0.<nº de commits>'
        required: false
        type: string

concurrency:
  group: release-pipeline
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OTA_DIR: ota-site
  OTA_BASE_URL: https://fefelipe-7.github.io/cecistudy
  KEEP_VERSIONS: '5'

jobs:
  prepare:
    name: validar + bundle web
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.checksum.outputs.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: test
        run: npm run test

      - name: build web
        run: npm run build

      - name: derive version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.$(git rev-list --count HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: zip bundle (ota)
        run: |
          mkdir -p "$OTA_DIR/bundles"
          (cd dist && zip -r "../$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" .)

      - name: compute checksum
        id: checksum
        run: |
          echo "sha=$(sha256sum "$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: upload dist (para sync nativo)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

      - name: upload ota bundle
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle
          path: ${{ env.OTA_DIR }}/bundles/cecistudy-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  android:
    name: android apk
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: setup java (temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install deps
        run: npm ci

      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: set version env
        run: |
          echo "APP_VERSION_NAME=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: import keystore (quando presente)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.jks" >> "$GITHUB_ENV"
          echo "→ release assinado: true" >> "$GITHUB_STEP_SUMMARY"

      - name: sync capacitor (android)
        run: npx cap sync android

      - name: build apk
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: ios ipa
    needs: prepare
    runs-on: macos-latest
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: sync capacitor (ios)
        run: npx cap sync ios

      - name: setup code signing
        if: env.IOS_TEAM_ID != ''
        run: |
          KEYCHAIN=cecistudy-build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > /tmp/cecistudy.p12
          security import /tmp/cecistudy.p12 -k "$KEYCHAIN" -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision"
          PROFILE_NAME=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision" 2>/dev/null | plutil -extract Name raw -)
          echo "IOS_PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "→ ipa assinado: true" >> "$GITHUB_STEP_SUMMARY"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: build ipa (release, dispositivo)
        if: env.IOS_TEAM_ID != ''
        run: |
          cd ios/App
          export_options=/tmp/export-options.plist
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.IOS_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/cecistudy.xcarchive \
            DEVELOPMENT_TEAM="${{ env.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_SPECIFIER" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/cecistudy.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$export_options"

      - name: 'build (fallback: simulador unsigned)'
        if: env.IOS_TEAM_ID == ''
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: upload ipa
        if: env.IOS_TEAM_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: error

  release:
    name: github release + ota
    needs: [prepare, android, ios]
    if: always() && needs.prepare.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: download apk
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: download ipa
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: download ota bundle
        uses: actions/download-artifact@v4
        with:
          name: ota-bundle
          path: ota-bundle

      - name: organize release assets
        run: |
          mkdir -p final
          cp "$(find release-assets -name '*.apk' | head -1)" "final/cecistudy-$VERSION-android.apk"
          if [ "${{ needs.ios.result }}" = "success" ]; then
            cp "$(find release-assets -name '*.ipa' | head -1)" "final/cecistudy-$VERSION-ios.ipa"
          fi
          cp "$(find ota-bundle -name '*.zip' | head -1)" "final/cecistudy-$VERSION.zip"
          ls -la final

      - name: create/update github release
        run: |
          NOTES=$(cat <<EOF
          ## cecistudy v$VERSION
          bundle web e apps nativos (android/iOS) gerados pelo pipeline de release.

          artefatos:
          - android: cecistudy-$VERSION-android.apk
          - ios: cecistudy-$VERSION-ios.ipa (presente quando a assinatura está configurada)
          - ota (web): cecistudy-$VERSION.zip

          ota: o app nativo com o plugin @capgo/capacitor-updater recebe esta versão automaticamente pelo github pages.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "cecistudy v$VERSION" --notes "$NOTES"
            gh release upload "$TAG" final/cecistudy-$VERSION-android.apk final/cecistudy-$VERSION.zip --clobber || true
            if [ "${{ needs.ios.result }}" = "success" ]; then
              gh release upload "$TAG" final/cecistudy-$VERSION-ios.ipa --clobber || true
            fi
          else
            ASSETS="final/cecistudy-$VERSION-android.apk final/cecistudy-$VERSION.zip"
            if [ "${{ needs.ios.result }}" = "success" ]; then
              ASSETS="$ASSETS final/cecistudy-$VERSION-ios.ipa"
            fi
            gh release create "$TAG" \
              --title "cecistudy v$VERSION" \
              --notes "$NOTES" \
              $ASSETS
          fi

      - name: publish ota (version.json + bundles)
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p "$OTA_DIR/bundles"
          cp "final/cecistudy-$VERSION.zip" "$OTA_DIR/bundles/cecistudy-$VERSION.zip"
          node .github/scripts/ota-manifest.mjs

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OTA_DIR }}

      - name: deploy to pages
        uses: actions/deploy-pages@v4

name: ci

# Gate de PR: garante que nenhuma mudança quebra a separação lógica
# mobile/desktop nem a compatibilidade via packages/*. Roda em todo PR para
# main e em pushes para main (guarda contra o "mexi num lado e quebrou o outro").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install deps
        run: npm ci
      # Gate único: typecheck + testes + fronteiras + build web e mobile
      # (spec-performance.md §8.4). Nunca executado a partir da máquina de
      # dev (GitHub bloqueado por TLS) — validar no primeiro PR.
      - name: verify
        run: npm run verify

name: ci

# Gate de PR: garante que nenhuma mudança quebra a separação lógica
# mobile/desktop nem a compatibilidade via packages/*. Roda em todo PR para
# main e em pushes para main (guarda contra o "mexi num lado e quebrou o outro").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# O contrato de dados mora no repositório do desktop (ADR-007, ADR-009), e três
# testes daqui leem e escrevem os arquivos dele por caminho relativo:
# src/lib/__tests__/goldenFixtures.test.ts, migrationFixtures.test.ts e
# canonicalHash.test.ts. Por isso este workflow faz um segundo checkout, em
# `.contrato-desktop/` na raiz deste repositório.
#
# A ref vive em `vars.CONTRATO_REF`, uma variável do repositório, e não em
# `env:` aqui: o `release.yml` precisa da mesma ref, e duas cópias de um SHA em
# dois arquivos é drift esperando acontecer. Para subir o contrato: commitar no
# desktop e rodar
#   gh variable set CONTRATO_REF -b <sha> -R fefelipe-7/cecistudy
env:
  CONTRATO_REF: ${{ vars.CONTRATO_REF }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout do contrato de dados
        uses: actions/checkout@v4
        with:
          repository: fefelipe-7/cecistudy-desktop
          ref: ${{ env.CONTRATO_REF }}
          # Dentro do workspace, e não como `../cecistudy-desktop`: o Actions
          # recusa path fora de `$GITHUB_WORKSPACE`. O resolver em
          # `packages/contracts/src/dados-path.ts` procura este diretório antes
          # de subir a árvore, então o mesmo código funciona nos dois layouts.
          path: .contrato-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install deps
        run: npm ci
      - name: typecheck
        run: npm run lint
      - name: test
        run: npm run test
      - name: boundary check (mobile/desktop/packages)
        run: node .github/scripts/check-boundaries.mjs
      - name: contrato de dados em conformidade
        run: node .contrato-desktop/contratos/dados/verify-schema.mjs --schema-ts=packages/data/src/schema.ts

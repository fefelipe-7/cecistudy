name: ci

# Gate de PR: garante que nenhuma mudança quebra a separação lógica
# mobile/desktop nem a compatibilidade via packages/*. Roda em todo PR para
# main e em pushes para main (guarda contra o "mexi num lado e quebrou o outro").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# O contrato de dados mora no repositório do desktop (ADR-007, ADR-009), e três
# testes daqui leem e escrevem os arquivos dele por caminho relativo:
# src/lib/__tests__/goldenFixtures.test.ts, migrationFixtures.test.ts e
# canonicalHash.test.ts. Por isso este workflow faz um segundo checkout.
#
# A ref é fixada em SHA, não em `main`, de propósito: `main` do desktop mudaria
# o resultado deste gate sem que ninguém mexesse no mobile. Quando o contrato
# muda de propósito, o bump é explícito e o diff mostra por quê.
#
# Para subir o contrato: commitar no desktop, pegar o SHA e trocar aqui.
env:
  CONTRATO_REF: 71bc142a827dbd6d056d4ba5b889160fe983cec1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout do contrato de dados
        uses: actions/checkout@v4
        with:
          repository: fefelipe-7/cecistudy-desktop
          ref: ${{ env.CONTRATO_REF }}
          path: ../cecistudy-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install deps
        run: npm ci
      - name: typecheck
        run: npm run lint
      - name: test
        run: npm run test
      - name: boundary check (mobile/desktop/packages)
        run: node .github/scripts/check-boundaries.mjs
      - name: contrato de dados em conformidade
        run: node ../cecistudy-desktop/contratos/dados/verify-schema.mjs --schema-ts=packages/data/src/schema.ts

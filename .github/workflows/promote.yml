name: promote

# Promoção automática de camada: `dev -> staging -> main`.
#
# O PR continua existindo (o ruleset exige PR e a `branch-policy` valida a
# origem), mas ninguém precisa abri-lo à mão: este workflow abre e liga o
# auto-merge. Quem decide se o merge acontece é o gate da camada de destino —
# `staging` roda `gate-full`, e `main` só recebe o que já passou por lá.
#
# Usa PAT e não `GITHUB_TOKEN`: PR criado com o token padrão não dispara
# workflow, e os checks obrigatórios nunca apareceriam (auto-merge travaria).

on:
  push:
    branches: [dev, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: abre o PR da próxima camada e liga o auto-merge
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            dev)     base=staging ;;
            staging) base=main ;;
            *) echo "branch sem promoção: $GITHUB_REF_NAME"; exit 0 ;;
          esac
          head="$GITHUB_REF_NAME"

          if [ "$(git rev-list --count "origin/$base".."origin/$head")" = "0" ]; then
            echo "nada a promover: $head já está em $base"
            exit 0
          fi

          pr=$(gh pr list --base "$base" --head "$head" --state open \
                 --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base "$base" --head "$head" \
              --title "merge: promove $head para $base" \
              --body "Promoção automática de camada: \`$head\` → \`$base\`. O merge acontece quando o gate da camada de destino fecha." >/dev/null
            pr=$(gh pr list --base "$base" --head "$head" --state open \
                   --json number --jq '.[0].number')
          fi
          gh pr merge "$pr" --auto --merge
          echo "auto-merge ligado no PR #$pr ($head -> $base)"

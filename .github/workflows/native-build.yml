name: native build (apk + ipa)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

jobs:
  android:
    name: android apk (debug)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: setup java (temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install deps
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: build web
        run: npm run build

      - name: sync capacitor (android)
        run: npx cap sync android

      - name: build apk (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: cecistudy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: ios ipa (assinado p/ dispositivo)
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: build web
        run: npm run build

      - name: sync capacitor (ios)
        run: npx cap sync ios

      # ---------------------------------------------------------------
      # Assinatura manual: só roda quando IOS_TEAM_ID está configurado.
      # Secrets necessários:
      #   IOS_TEAM_ID                   → team id (ex.: AB12CD34EF)
      #   IOS_CERTIFICATE               → .p12 da Apple Distribution/Dev em base64
      #   IOS_CERTIFICATE_PASSWORD      → senha do .p12
      #   IOS_PROVISIONING_PROFILE      → .mobileprovision em base64
      #   IOS_EXPORT_METHOD (opcional)  → ad-hoc (padrão) | app-store | development
      # ---------------------------------------------------------------
      - name: setup code signing
        if: env.IOS_TEAM_ID != ''
        run: |
          KEYCHAIN=cecistudy-build.keychain
          # keychain próprio do job (efêmero)
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          # certificado
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > /tmp/cecistudy.p12
          security import /tmp/cecistudy.p12 -k "$KEYCHAIN" -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          # provisioning profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision"
          # nome do perfil (para PROVISIONING_PROFILE_SPECIFIER)
          PROFILE_NAME=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/cecistudy.mobileprovision" 2>/dev/null | plutil -extract Name raw -)
          echo "IOS_PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: build ipa (Release, dispositivo)
        if: env.IOS_TEAM_ID != ''
        run: |
          cd ios/App
          export_options=/tmp/export-options.plist
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.IOS_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/cecistudy.xcarchive \
            DEVELOPMENT_TEAM="${{ env.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_SPECIFIER" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/cecistudy.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$export_options"
          ls -la build/ipa

      - name: build (fallback: simulador unsigned)
        if: env.IOS_TEAM_ID == ''
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: upload ipa
        if: env.IOS_TEAM_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: cecistudy-ios-ipa
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: error
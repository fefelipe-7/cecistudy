name: ota publish (web bundle -> github pages)

# Publica o bundle web do cecistudy para o GitHub Pages, onde o app nativo
# (Android/iOS via @capgo/capacitor-updater) busca atualizações OTA.
#
# Endpoints gerados:
#   version.json        -> https://fefelipe-7.github.io/cecistudy/version.json
#   bundles/<ver>.zip   -> https://fefelipe-7.github.io/cecistudy/bundles/...
#
# Requisito manual (uma vez): Settings -> Pages -> Source: "GitHub Actions".
#
# A versão é derivada automaticamente (1.0.<nº de commits>) e semver sempre
# crescente. O version.json mantém as últimas 5 versões em "available" para
# rollback sem rebuild (é só apontar "version"/"url"/"checksum" para uma antiga).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
  workflow_dispatch:

concurrency:
  group: ota-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  OTA_DIR: ota-site
  OTA_BASE_URL: https://fefelipe-7.github.io/cecistudy
  KEEP_VERSIONS: '5'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: test
        run: npm run test

      - name: build web
        run: npm run build

      - name: derive ota version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.$COUNT" >> "$GITHUB_OUTPUT"

      - name: zip bundle
        run: |
          mkdir -p "$OTA_DIR/bundles"
          (cd dist && zip -r "../$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" .)

      - name: compute checksum
        id: checksum
        run: |
          echo "sha=$(sha256sum "$OTA_DIR/bundles/cecistudy-${{ steps.version.outputs.version }}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: fetch previous manifest (best effort)
        run: |
          curl -sS --max-time 20 "$OTA_BASE_URL/version.json" -o /tmp/prev-version.json || echo '{}' > /tmp/prev-version.json

      - name: build version.json + carry forward bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.checksum.outputs.sha }}
          KEEP: ${{ env.KEEP_VERSIONS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          (async () => {
            const otaDir = process.env.OTA_DIR;
            const base = process.env.OTA_BASE_URL;
            const version = process.env.VERSION;
            const sha = process.env.SHA;
            const keep = Number(process.env.KEEP || 5);

            let prev = { available: [] };
            try {
              const raw = fs.readFileSync("/tmp/prev-version.json", "utf8");
              prev = JSON.parse(raw) || { available: [] };
            } catch { /* primeiro deploy */ }
            if (!Array.isArray(prev.available)) prev.available = [];

            const newEntry = {
              version,
              url: `${base}/bundles/cecistudy-${version}.zip`,
              checksum: sha,
              releasedAt: new Date().toISOString(),
            };

            const kept = [newEntry];
            const zips = new Set([`cecistudy-${version}.zip`]);

            for (const entry of prev.available) {
              if (kept.length >= keep) break;
              if (!entry || !entry.url || entry.version === version) continue;
              const name = path.basename(new URL(entry.url).pathname);
              if (zips.has(name)) continue;
              const dest = path.join(otaDir, "bundles", name);
              try {
                const res = await fetch(entry.url);
                if (!res.ok) continue;
                fs.writeFileSync(dest, Buffer.from(await res.arrayBuffer()));
                zips.add(name);
                kept.push(entry);
              } catch {
                /* zips antigos são best-effort; sem eles, o histórico encolhe */
              }
            }

            const manifest = { ...newEntry, available: kept };
            fs.writeFileSync(path.join(otaDir, "version.json"), JSON.stringify(manifest, null, 2) + "\n");
            console.log(JSON.stringify(manifest, null, 2));
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OTA_DIR }}

      - name: deploy to pages
        uses: actions/deploy-pages@v4